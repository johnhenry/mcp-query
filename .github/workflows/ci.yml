name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build mcp-query
        # Other workspaces (e.g. mcp-gate) import @johnhenry/mcp-query's subpath
        # exports (./server, ./testing), which resolve to dist/ — must exist
        # before their typecheck/test runs, not just before this repo's own.
        run: npm run build -w @johnhenry/mcp-query

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Test (all workspaces)
        run: npm test

      - name: Coverage (mcp-query)
        run: npm run test:coverage

      - name: Publish smoke (import the built entrypoint)
        working-directory: packages/mcp-query
        run: node -e "import('./dist/index.js').then(m => { if (!m.MCPClient) throw new Error('missing MCPClient export'); console.log('ok'); })"

      - name: Apps typecheck + build
        run: |
          for app in inspector console ops-cockpit approvals notebook composer prompt-studio switchboard; do
            npm run typecheck -w @mcp-query/$app
            npm run build -w @mcp-query/$app
          done
