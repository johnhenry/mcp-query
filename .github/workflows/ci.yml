name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1

  # Every published package (mcp-query, mcp-gate, mcp-query-ui, mcp-query-tanstack,
  # mcp-contract, mcp-record) and the CLI accept any @modelcontextprotocol/{client,server}
  # 2.x (peer / dependency range ^2.0.0, #42). The lockfile pins the latest 2.x that was
  # current when it was last refreshed (so build-test below runs the SDK-gated tests); this job
  # swaps in the floor (2.0.0) and the newest 2.x, then type-checks and tests all of them on
  # both legs to catch SDK drift in either direction (#116).
  sdk-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["2.0.0", "^2"]
    name: sdk-matrix (SDK ${{ matrix.sdk }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install SDK ${{ matrix.sdk }}
        # --legacy-peer-deps: kept for safety against stale peer pins in the lockfile; it is not
        # needed today (the old nested pre-rename copies that peer-pinned 2.0.0 are gone).
        run: npm install --no-save --legacy-peer-deps "@modelcontextprotocol/client@${{ matrix.sdk }}" "@modelcontextprotocol/server@${{ matrix.sdk }}" "@modelcontextprotocol/core@${{ matrix.sdk }}"
      - name: Show the resolved SDK (one copy of each, matching the leg)
        run: |
          npm ls @modelcontextprotocol/client @modelcontextprotocol/server @modelcontextprotocol/core --all || true
          node -e 'const v=JSON.parse(require("fs").readFileSync("node_modules/@modelcontextprotocol/client/package.json","utf8")).version; console.log("client", v); if ("${{ matrix.sdk }}"==="2.0.0" && v!=="2.0.0") { console.error("floor leg did not resolve 2.0.0"); process.exit(1); }'
      # Other workspaces import @johnhenry/mcp-query's subpath exports (./server, ./testing),
      # which resolve to dist/, so it must be built before any of them type-checks or tests.
      - name: Build the packages the others import by name
        # In dependency order: mcp-query first, then mcp-gate and mcp-contract (which import it),
        # then mcp-record (which imports mcp-contract). Their dependents resolve them through
        # dist/, and plain `npm run -w` does not build dependencies the way turbo does.
        run: |
          npm run build -w @johnhenry/mcp-query
          npm run build -w @johnhenry/mcp-gate -w @johnhenry/mcp-contract
          npm run build -w @johnhenry/mcp-record
      - name: Typecheck (published packages + CLI)
        run: >-
          npm run typecheck
          -w @johnhenry/mcp-query -w @johnhenry/mcp-gate -w @johnhenry/mcp-query-ui
          -w @johnhenry/mcp-query-tanstack -w @johnhenry/mcp-contract -w @johnhenry/mcp-record
          -w @mcp-query/cli
      - name: Test (published packages + CLI)
        run: >-
          npm test
          -w @johnhenry/mcp-query -w @johnhenry/mcp-gate -w @johnhenry/mcp-query-ui
          -w @johnhenry/mcp-query-tanstack -w @johnhenry/mcp-contract -w @johnhenry/mcp-record
          -w @mcp-query/cli

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Build mcp-query
        # Other workspaces (e.g. mcp-gate) import @johnhenry/mcp-query's subpath
        # exports (./server, ./testing), which resolve to dist/ — must exist
        # before their typecheck/test runs, not just before this repo's own.
        run: npm run build -w @johnhenry/mcp-query

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Test (all workspaces)
        run: npm test

      - name: Coverage (mcp-query)
        # The lockfile pins the latest 2.x SDK, so the SDK-gated tests (skills, modern-era
        # tasks, DPoP) run and count here; the sdk-matrix floor leg proves 2.0.0 still works.
        run: npm run test:coverage

      - name: Publish smoke (import the built entrypoint)
        working-directory: packages/mcp-query
        run: node -e "import('./dist/index.js').then(m => { if (!m.MCPClient) throw new Error('missing MCPClient export'); console.log('ok'); })"

      - name: Root examples smoke (cross-package flows)
        # `npm run examples` builds mcp-query + mcp-gate + mcp-query-tanstack itself,
        # then runs all six root examples end to end (in-process mocks, offline).
        run: npm run examples

      - name: Apps typecheck + build
        run: |
          for app in inspector console ops-cockpit approvals notebook composer prompt-studio switchboard; do
            npm run typecheck -w @mcp-query/$app
            npm run build -w @mcp-query/$app
          done
