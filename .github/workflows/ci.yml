name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1

  # mcp-query / mcp-gate accept any @modelcontextprotocol/{client,server} 2.x
  # (peer / dependency range ^2.0.0, #42). The lockfile pins one version, so this
  # job swaps in the floor (2.0.0) and the newest 2.x to catch SDK drift.
  sdk-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["2.0.0", "^2"]
    name: sdk-matrix (SDK ${{ matrix.sdk }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install SDK ${{ matrix.sdk }}
        # --legacy-peer-deps: stale nested pre-rename copies in the lockfile
        # (apps/cli depend on old @johnhenry/mcp-gate 0.0.1) still peer-pin 2.0.0.
        run: npm install --no-save --legacy-peer-deps "@modelcontextprotocol/client@${{ matrix.sdk }}" "@modelcontextprotocol/server@${{ matrix.sdk }}" "@modelcontextprotocol/core@${{ matrix.sdk }}"
      - run: npm ls @modelcontextprotocol/client @modelcontextprotocol/server @modelcontextprotocol/core --depth=0 --workspaces=false || true
      - run: npm run build -w @johnhenry/mcp-query
      - run: npm run typecheck -w @johnhenry/mcp-query -w @johnhenry/mcp-gate
      - run: npm test -w @johnhenry/mcp-query -w @johnhenry/mcp-gate

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Build mcp-query
        # Other workspaces (e.g. mcp-gate) import @johnhenry/mcp-query's subpath
        # exports (./server, ./testing), which resolve to dist/ — must exist
        # before their typecheck/test runs, not just before this repo's own.
        run: npm run build -w @johnhenry/mcp-query

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Test (all workspaces)
        run: npm test

      - name: Coverage (mcp-query)
        run: npm run test:coverage

      - name: Publish smoke (import the built entrypoint)
        working-directory: packages/mcp-query
        run: node -e "import('./dist/index.js').then(m => { if (!m.MCPClient) throw new Error('missing MCPClient export'); console.log('ok'); })"

      - name: Root examples smoke (cross-package flows)
        # `npm run examples` builds mcp-query + mcp-gate + mcp-query-tanstack itself,
        # then runs all six root examples end to end (in-process mocks, offline).
        run: npm run examples

      - name: Apps typecheck + build
        run: |
          for app in inspector console ops-cockpit approvals notebook composer prompt-studio switchboard; do
            npm run typecheck -w @mcp-query/$app
            npm run build -w @mcp-query/$app
          done
