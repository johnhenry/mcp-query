# Monorepo publish with Changesets (fleet publish model: main is the release branch;
# see johnhenry/workflows' README).
#
# Flow: PRs that change a published package include a changeset (`npm run changeset`).
# On every push to main this workflow either (a) opens/updates the "Version Packages"
# PR that applies the bumps, or (b) if that PR was just merged, publishes every package
# whose version is not on npm yet and -- as a by-product -- pushes a git tag and creates
# a GitHub Release per published package (changesets/action's default
# `createGithubReleases: true`; needs `contents: write`).
#
# `npm run release` (scripts/release.mjs) builds, then publishes packages that are new
# on the registry (already-published versions are skipped, so re-runs are safe).
# @johnhenry/mcp-query-tanstack keeps its `rc` dist-tag via publishConfig.tag, which
# scripts/release.mjs honours (`changeset publish` itself does not).
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # version-bump commit, tags, GitHub Releases
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: "26" # must equal the root engines.node major
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify before publishing
        # Build mcp-query first: other workspaces (mcp-gate, mcp-query-tanstack) import
        # its subpath exports (./server, ./testing), which resolve to dist/.
        run: |
          npm run build -w @johnhenry/mcp-query
          npm run typecheck
          npm test

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
          # createGithubReleases defaults to true: a tag + Release per package.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
