name: Release

# Publish the core package (mcp-query) to npm.
#   - Tag-triggered: push a tag like v0.1.0 (must match the package version).
#   - Or run manually via workflow_dispatch (uses the version already in package.json).
# Requires the NPM_TOKEN repo secret (an npm automation token with publish rights).
#
# Publishing is idempotent: a version already on the registry is skipped, so
# re-running a release or dispatching twice is safe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Shared with the other release workflows in this repo so two packages never
# publish concurrently.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Gate (typecheck + tests + build)
        # Build mcp-query first: other workspaces (e.g. mcp-gate) import its
        # subpath exports (./server, ./testing), which resolve to dist/.
        run: |
          npm run build -w @johnhenry/mcp-query
          npm run typecheck
          npm test

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./packages/mcp-query/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish smoke (import the built entrypoint)
        working-directory: packages/mcp-query
        run: node -e "import('./dist/index.js').then(m => { if (!m.MCPClient) throw new Error('missing MCPClient export'); console.log('ok'); })"

      - name: No NPM_TOKEN — skipping publish
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice title=Publish skipped::NPM_TOKEN is not configured; nothing was published."

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        # Prerelease versions (0.1.0-rc.1, …) go to the "rc" dist-tag so plain
        # `npm install` never resolves to them; stable versions go to "latest".
        # Idempotent: `npm view` exits non-zero for a version that isn't on the
        # registry yet, which is the signal to publish.
        run: |
          PKG_VERSION=$(node -p "require('./packages/mcp-query/package.json').version")
          if npm view "@johnhenry/mcp-query@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice title=Already published::@johnhenry/mcp-query@$PKG_VERSION is already on npm; nothing to do."
            exit 0
          fi
          case "$PKG_VERSION" in
            *-*) DIST_TAG=rc ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "publishing $PKG_VERSION with dist-tag $DIST_TAG"
          npm publish --workspace @johnhenry/mcp-query --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
