name: Release

# Changesets for the whole monorepo + publish of @johnhenry/mcp-query, from main
# (fleet publish model: main is the release branch, see johnhenry/workflows' README).
#
# On every push to main this workflow either (a) opens/updates the "chore: version
# packages" PR that applies pending changesets (versioning ALL workspaces
# independently), or (b) when that PR has just been merged, runs `npm run release --
# @johnhenry/mcp-query`, which publishes mcp-query if its version is new (idempotent)
# and, as a by-product, changesets/action pushes the tag and creates the GitHub Release.
#
# Only mcp-query is published here. npm trusted publishing trusts one workflow
# filename per package, so @johnhenry/mcp-gate and @johnhenry/mcp-query-tanstack are
# published by release-gate.yml and release-mcp-query-tanstack.yml (same trigger,
# same version-is-new guard, same tag + Release by-product). Do not rename these files.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # version-bump commit, tags, GitHub Releases
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # must equal the root engines.node major
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Gate (typecheck + tests + build)
        # Build mcp-query first: other workspaces (e.g. mcp-gate) import its
        # subpath exports (./server, ./testing), which resolve to dist/.
        run: |
          npm run build -w @johnhenry/mcp-query
          npm run typecheck
          npm test

      - name: Publish smoke (import the built entrypoint)
        working-directory: packages/mcp-query
        run: node -e "import('./dist/index.js').then(m => { if (!m.MCPClient) throw new Error('missing MCPClient export'); console.log('ok'); })"

      - name: Version PR or publish mcp-query
        uses: changesets/action@v1
        with:
          publish: npm run release -- @johnhenry/mcp-query
          version: npm run version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
          # createGithubReleases defaults to true: a tag + Release for what was published.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
